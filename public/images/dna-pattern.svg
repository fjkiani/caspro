<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Base pairs and rungs -->
  <g opacity="0.7">
    <!-- DNA Backbone 1 -->
    <path d="M20,0 Q30,25 20,50 Q30,75 20,100" fill="none" stroke="#60a5fa" stroke-width="2" />
    
    <!-- DNA Backbone 2 -->
    <path d="M80,0 Q70,25 80,50 Q70,75 80,100" fill="none" stroke="#f87171" stroke-width="2" />
    
    <!-- Base pairs (rungs) -->
    <line x1="20" y1="10" x2="80" y2="10" stroke="#34d399" stroke-width="1.5" />
    <line x1="20" y1="30" x2="80" y2="30" stroke="#fbbf24" stroke-width="1.5" />
    <line x1="20" y1="50" x2="80" y2="50" stroke="#34d399" stroke-width="1.5" />
    <line x1="20" y1="70" x2="80" y2="70" stroke="#fbbf24" stroke-width="1.5" />
    <line x1="20" y1="90" x2="80" y2="90" stroke="#34d399" stroke-width="1.5" />
    
    <!-- Base pair nucleotides (circles at the ends of the rungs) -->
    <circle cx="20" cy="10" r="3" fill="#60a5fa" />
    <circle cx="80" cy="10" r="3" fill="#f87171" />
    
    <circle cx="20" cy="30" r="3" fill="#60a5fa" />
    <circle cx="80" cy="30" r="3" fill="#f87171" />
    
    <circle cx="20" cy="50" r="3" fill="#60a5fa" />
    <circle cx="80" cy="50" r="3" fill="#f87171" />
    
    <circle cx="20" cy="70" r="3" fill="#60a5fa" />
    <circle cx="80" cy="70" r="3" fill="#f87171" />
    
    <circle cx="20" cy="90" r="3" fill="#60a5fa" />
    <circle cx="80" cy="90" r="3" fill="#f87171" />
  </g>
</svg> 