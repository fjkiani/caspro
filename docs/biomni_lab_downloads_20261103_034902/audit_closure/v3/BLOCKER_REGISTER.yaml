  result: "8 passed, 2 failed (T2, T12) — T6 is in the 8 passed"
  sl_wiring_verdict: >
    SL wiring is verified. ITGAV (fdr=0.013, delta=-0.72) maps to SLAnnotation(tier=Strong).
    cilengitide.sl_tier='Strong' confirmed. Full Therapy Fit production readiness is NOT
